{% extends "base.html" %}

{% block title %}Página Não Encontrada - AGRI.vendasMz{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="mb-4">
        <i class="fas fa-search fa-5x text-muted opacity-50"></i>
    </div>
    <h1 class="display-4 fw-bold text-muted">404</h1>
    <h2 class="mb-3">Página Não Encontrada</h2>
    <p class="lead text-muted mb-4">
        A página que você está procurando não existe ou foi movida.
